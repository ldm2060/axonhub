# Usage Monitor Channel schema
# Extends the Ent-generated types with custom fields and operations

# Custom types for field configuration and parsed data
type FieldConfig {
    key: String!
    label: String!
    path: String
    type: String
    format: String!
    totalPath: String
    unit: String
    groupIndex: [Int!]
    displayOrder: Int!
    expression: String
}

type ParsedFieldValue {
    key: String!
    label: String!
    value: String
    total: String
    percent: Float
    unit: String
    format: String!
    error: String
}

type Variable {
    key: String!
    path: String!
    type: String!
    groupIndex: [Int!]
}

type DisplayField {
    key: String!
    label: String!
    valueRef: String!
    format: String!
    unit: String
    totalRef: String
    displayOrder: Int!
    badge: String
    badgePresets: String
}

# Extend the Ent-generated UsageMonitorChannel with computed fields
extend type UsageMonitorChannel {
    "API headers as JSON string for frontend editing"
    apiHeadersString: String!
    "Parsed field values from last poll data"
    parsedData: [ParsedFieldValue!]
}

# Input types for create/update operations
input FieldConfigInput {
    key: String!
    label: String!
    path: String
    type: String
    format: String!
    totalPath: String
    unit: String
    groupIndex: [Int!]
    displayOrder: Int!
    expression: String
}

input VariableInput {
    key: String!
    path: String!
    type: String!
    groupIndex: [Int!]
}

input DisplayFieldInput {
    key: String!
    label: String!
    valueRef: String!
    format: String!
    unit: String
    totalRef: String
    displayOrder: Int!
    badge: String
    badgePresets: String
}

input CreateUsageMonitorChannelInput {
    name: String!
    source: UsageMonitorChannelSource!
    channelId: ID
    providerType: UsageMonitorChannelProviderType
    apiKey: String
    apiUrl: String
    apiMethod: UsageMonitorChannelAPIMethod
    apiHeaders: String
    apiBody: String
    pollInterval: Int!
    fields: [FieldConfigInput!]!
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
}

input UpdateUsageMonitorChannelInput {
    name: String
    apiUrl: String
    apiMethod: UsageMonitorChannelAPIMethod
    apiHeaders: String
    apiBody: String
    pollInterval: Int
    fields: [FieldConfigInput!]
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
    status: UsageMonitorChannelStatus
    apiKey: String
}

input TestUsageMonitorChannelInput {
    apiUrl: String!
    apiMethod: UsageMonitorChannelAPIMethod!
    apiHeaders: String!
    apiBody: String
    fields: [FieldConfigInput!]
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
}

type TestResult {
    success: Boolean!
    rawResponse: String
    parsedFields: [ParsedFieldValue!]
    error: String
}

extend type Query {
    "List all usage monitor channels"
    usageMonitorChannelsList: [UsageMonitorChannel!]!
    "Get a single usage monitor channel by ID"
    usageMonitorChannelById(id: ID!): UsageMonitorChannel
}

# Quota Monitor Template - pre-configured provider templates
type QuotaMonitorTemplate {
  providerType: String!
  name: String!
  description: String
  apiUrl: String!
  apiMethod: UsageMonitorChannelAPIMethod!
  headerFormat: String!
  apiBody: String
  fields: [FieldConfig!]! @deprecated(reason: "Use variables and displayFields instead")
  variables: [Variable!]!
  displayFields: [DisplayField!]!
}

extend type UsageMonitorChannel {
  apiKey: String @goField(forceResolver: true)
}

extend type UsageMonitorChannel {
  variables: [Variable!]! @goField(forceResolver: true)
  displayFields: [DisplayField!]! @goField(forceResolver: true)
}

extend type Query {
  "List all available quota monitor templates"
  quotaMonitorTemplates: [QuotaMonitorTemplate!]!
}

extend type Mutation {
    "Create a new usage monitor channel"
    createUsageMonitorChannel(input: CreateUsageMonitorChannelInput!): UsageMonitorChannel!
    "Update an existing usage monitor channel"
    updateUsageMonitorChannel(id: ID!, input: UpdateUsageMonitorChannelInput!): UsageMonitorChannel!
    "Soft delete a usage monitor channel"
    deleteUsageMonitorChannel(id: ID!): Boolean!
    "Test connection to the API without saving"
    testUsageMonitorChannel(input: TestUsageMonitorChannelInput!): TestResult!
    "Force refresh a single channel"
    refreshUsageMonitorChannel(id: ID!): UsageMonitorChannel!
}
