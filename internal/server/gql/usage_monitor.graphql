# Usage Monitor Channel schema
# Extends the Ent-generated types with custom fields and operations

# Custom types for field configuration and parsed data
type FieldConfig {
    key: String!
    label: String!
    path: String
    type: String
    format: String!
    totalPath: String
    unit: String
    groupIndex: [Int!]
    displayOrder: Int!
    expression: String
}

type ParsedFieldValue {
    key: String!
    label: String!
    value: String
    total: String
    percent: Float
    unit: String
    format: String!
    error: String
    group: String
    groupLabel: String
}

type Variable {
    key: String!
    path: String!
    type: String!
    groupIndex: [Int!]
}

type DisplayField {
    key: String!
    label: String!
    valueRef: String!
    format: String!
    unit: String
    totalRef: String
    displayOrder: Int!
    badge: String
    badgePresets: String
    group: String
    groupLabelRef: String
}

# Extend the Ent-generated UsageMonitorChannel with computed fields
extend type UsageMonitorChannel {
    "API headers as JSON string for frontend editing"
    apiHeadersString: String!
    "Parsed field values from last poll data"
    parsedData: [ParsedFieldValue!]
}

# Input types for create/update operations
input FieldConfigInput {
    key: String!
    label: String!
    path: String
    type: String
    format: String!
    totalPath: String
    unit: String
    groupIndex: [Int!]
    displayOrder: Int!
    expression: String
}

input VariableInput {
    key: String!
    path: String!
    type: String!
    groupIndex: [Int!]
}

input DisplayFieldInput {
    key: String!
    label: String!
    valueRef: String!
    format: String!
    unit: String
    totalRef: String
    displayOrder: Int!
    badge: String
    badgePresets: String
    group: String
    groupLabelRef: String
}

input CreateUsageMonitorChannelInput {
    name: String!
    source: UsageMonitorChannelSource!
    channelId: ID
    providerType: UsageMonitorChannelProviderType
    apiKey: String
    apiUrl: String
    apiMethod: UsageMonitorChannelAPIMethod
    apiHeaders: String
    apiBody: String
    pollInterval: Int!
    fields: [FieldConfigInput!]!
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
}

input UpdateUsageMonitorChannelInput {
    name: String
    apiUrl: String
    apiMethod: UsageMonitorChannelAPIMethod
    apiHeaders: String
    apiBody: String
    pollInterval: Int
    fields: [FieldConfigInput!]
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
    status: UsageMonitorChannelStatus
    apiKey: String
}

input TestUsageMonitorChannelInput {
    apiUrl: String!
    apiMethod: UsageMonitorChannelAPIMethod!
    apiHeaders: String!
    apiBody: String
    providerType: String
    apiKey: String
    fields: [FieldConfigInput!]
    variables: [VariableInput!]
    displayFields: [DisplayFieldInput!]
}

type TestResult {
    success: Boolean!
    rawResponse: String
    parsedFields: [ParsedFieldValue!]
    error: String
}

# -------------------------------------------------------------------------
# Channel Quota Monitor Binding types
# -------------------------------------------------------------------------

"Read model for a channel-to-monitor binding, enriched with monitor name"
type ChannelQuotaMonitorBinding {
    id: ID!
    channelID: ID!
    usageMonitorChannelID: ID!
    usageMonitorName: String!
    enabled: Boolean!
    "Which quota statuses trigger this binding (e.g. exhausted, warning)"
    triggerStatuses: [String!]!
    "Structured conditions for triggering; evaluated against monitor poll data"
    conditions: [QuotaMonitorBindingCondition!]!
    lastTriggeredAt: Time
    lastTriggerReason: String
}

input SaveChannelQuotaMonitorBindingInput {
    usageMonitorChannelID: ID!
    enabled: Boolean!
    "Which quota statuses trigger this binding"
    triggerStatuses: [String!]
    "Structured conditions for triggering"
    conditions: [QuotaMonitorBindingConditionInput!]
}

input SaveChannelQuotaMonitorBindingsInput {
    "Aggregation strategy: any (default) or all"
    strategy: String!
    bindings: [SaveChannelQuotaMonitorBindingInput!]!
}

# -------------------------------------------------------------------------
# Usage Monitor Binding Summary (for monitor detail page)
# -------------------------------------------------------------------------

"Summary of one channel bound to a usage monitor"
type UsageMonitorBindingSummary {
    channelID: ID!
    channelName: String!
    usageMonitorChannelID: ID!
    "Aggregation strategy from the channel"
    strategy: String!
    enabled: Boolean!
    triggerStatuses: [String!]!
    conditions: [QuotaMonitorBindingCondition!]!
    "Whether the binding currently matches (trigger fires)"
    matched: Boolean!
    "Human-readable reason for the matched state"
    reason: String!
}

# -------------------------------------------------------------------------
# Quota Monitor Template - pre-configured provider templates
# -------------------------------------------------------------------------

type QuotaMonitorTemplate {
  providerType: String!
  name: String!
  description: String
  apiUrl: String!
  apiMethod: UsageMonitorChannelAPIMethod!
  headerFormat: String!
  apiBody: String
  authType: String
  credentialLabel: String
  credentialPlaceholder: String
  fields: [FieldConfig!]! @deprecated(reason: "Use variables and displayFields instead")
  variables: [Variable!]!
  displayFields: [DisplayField!]!
}

extend type UsageMonitorChannel {
  apiKey: String @goField(forceResolver: true)
}

extend type UsageMonitorChannel {
  variables: [Variable!]! @goField(forceResolver: true)
  displayFields: [DisplayField!]! @goField(forceResolver: true)
}

# -------------------------------------------------------------------------
# Queries
# -------------------------------------------------------------------------

extend type Query {
    "List all usage monitor channels"
    usageMonitorChannelsList: [UsageMonitorChannel!]!
    "Get a single usage monitor channel by ID"
    usageMonitorChannelById(id: ID!): UsageMonitorChannel
    "List all available quota monitor templates"
    quotaMonitorTemplates: [QuotaMonitorTemplate!]!
    "List all active quota monitor bindings for a channel"
    channelQuotaMonitorBindings(channelID: ID!): [ChannelQuotaMonitorBinding!]!
    "List all binding summaries across all channels and monitors"
    usageMonitorBindingSummaries: [UsageMonitorBindingSummary!]!
}

# -------------------------------------------------------------------------
# Mutations
# -------------------------------------------------------------------------

extend type Mutation {
    "Create a new usage monitor channel"
    createUsageMonitorChannel(input: CreateUsageMonitorChannelInput!): UsageMonitorChannel!
    "Update an existing usage monitor channel"
    updateUsageMonitorChannel(id: ID!, input: UpdateUsageMonitorChannelInput!): UsageMonitorChannel!
    "Soft delete a usage monitor channel"
    deleteUsageMonitorChannel(id: ID!): Boolean!
    "Test connection to the API without saving"
    testUsageMonitorChannel(input: TestUsageMonitorChannelInput!): TestResult!
    "Force refresh a single channel"
    refreshUsageMonitorChannel(id: ID!): UsageMonitorChannel!
    "Save channel quota monitor bindings (replaces all active bindings for the channel) and evaluate"
    saveChannelQuotaMonitorBindings(channelID: ID!, input: SaveChannelQuotaMonitorBindingsInput!): [ChannelQuotaMonitorBinding!]!
}
