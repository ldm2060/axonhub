# schema tells gqlgen where the GraphQL schema is located.
schema:
  # axonhub.graphql must be loaded before ent.graphql because it defines DisabledAPIKey
  # which is referenced by the disabled_api_keys field in Channel schema
  - axonhub.graphql
  - ent.graphql
  - dashboard.graphql
  - scopes.graphql
  - me.graphql
  - system.graphql
  - filter.graphql
  - model.graphql
  - backup.graphql
  - channel_probe.graphql
  - prompt.graphql
  - prompt_protection_rule.graphql
  - price.graphql
  - cost.graphql
  - publish_request.graphql
  - usage_monitor.graphql

omit_gqlgen_version_in_file_notice: true

#exec:
#  layout: follow-schema
#  dir: ./graph
#  package: graph

# resolver reports where the resolver implementations go.
resolver:
  layout: follow-schema
  dir: .

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.

# autobind tells gqngen to search for any type names in the GraphQL schema in the
# provided package. If they match it will use them, otherwise it will generate new.
autobind:
  - github.com/99designs/gqlgen/graphql/introspection
  - github.com/ldm2060/axonhub/internal/ent
  - github.com/ldm2060/axonhub/internal/ent/user
  - github.com/ldm2060/axonhub/internal/ent/apikey
  - github.com/ldm2060/axonhub/internal/ent/request
  - github.com/ldm2060/axonhub/internal/ent/requestexecution
  - github.com/ldm2060/axonhub/internal/ent/channel
  - github.com/ldm2060/axonhub/internal/ent/usagemonitorchannel
  - github.com/ldm2060/axonhub/internal/server/biz

converters:
  - from: "*github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrToInt"

  - from: "github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrToInt"

  - from: "github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "*int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrToIntPtr"

  - from: "*github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "*int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrToIntPtr"

  - from: "[]*github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "[]*int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrsToIntPtrs"

  - from: "[]*github.com/ldm2060/axonhub/internal/objects.GUID"
    to: "[]int"
    with: "github.com/ldm2060/axonhub/internal/objects.ConvertGUIDPtrsToInts"

